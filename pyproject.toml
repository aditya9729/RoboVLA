[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robovla"
version = "0.1.0"
description = "Minimal Vision-Language-Action (VLA) policy with a flow matching action head."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Aditya Gudal" }]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pydantic>=2.6",
    "numpy>=1.26",
    "open_clip_torch>=2.24",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
robovla = "robovla.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robovla"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "RUF", "ANN"]
ignore = ["ANN101", "ANN102"]  # self/cls type annotations not needed

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
